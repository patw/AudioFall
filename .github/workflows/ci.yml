name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: models/ggml-large-v3-turbo-q5_0.bin
          key: whisper-turbo-q5-394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
          enableCrossOsArchive: true
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake qt6-base-dev qt6-multimedia-dev libgl-dev
      - run: ./build_linux.sh
      - name: Verify embedded CPU transcription
        run: |
          build_linux/audiofall --transcribe-file build_linux/_deps/whisper-src/samples/jfk.wav > transcript.txt
          grep -qi "ask not what your country" transcript.txt

  macos:
    name: macOS build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: models/ggml-large-v3-turbo-q5_0.bin
          key: whisper-turbo-q5-394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
          enableCrossOsArchive: true
      - run: brew install qt cmake
      - name: Configure, build, and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          build/audiofall.app/Contents/MacOS/audiofall --transcribe-file build/_deps/whisper-src/samples/jfk.wav > transcript.txt
          grep -qi "ask not what your country" transcript.txt

  windows:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache bundled Whisper model
        uses: actions/cache@v4
        with:
          path: models/ggml-large-v3-turbo-q5_0.bin
          key: whisper-turbo-q5-394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
          enableCrossOsArchive: true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: cmd
        run: |
          cmake -S . -B build_windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%QT_ROOT_DIR%"
          cmake --build build_windows
          set QT_QPA_PLATFORM=offscreen
          ctest --test-dir build_windows --output-on-failure
      - name: Verify embedded CPU transcription
        shell: powershell
        run: |
          & build_windows/audiofall.exe --transcribe-file build_windows/_deps/whisper-src/samples/jfk.wav | Out-File -Encoding utf8 transcript.txt
          if ($LASTEXITCODE -ne 0) { throw "Local transcription failed" }
          if (!(Select-String -Path transcript.txt -Pattern "ask not what your country" -Quiet)) { throw "Unexpected transcript" }
